[build]
  command = "cd backend && npm install && cd ../web-admin && npm install && npm run build"
  publish = "web-admin/dist/shopmkt-admin"
  functions = "backend/.netlify/functions"

[functions]
  node_bundler = "esbuild"

# Proxy API routes to the Render backend service
[[redirects]]
  from = "/api/*"
  to = "https://shopmkt-backend.onrender.com/:splat"
  status = 200
  force = true

