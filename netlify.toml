[build]
  command = "cd backend && npm install && cd ../web-admin && npm install && npm run build"
  publish = "web-admin/dist/shopmkt-admin"
  functions = "backend/.netlify/functions"

[functions]
  node_bundler = "esbuild"

# Proxy only API routes to the backend function to avoid interfering with static assets
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true

